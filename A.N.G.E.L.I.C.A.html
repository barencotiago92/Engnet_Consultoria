<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A.N.G.E.L.I.C.A | Painel de Localidades</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
:root {
  --color-bg: #eef2f1;
  --color-surface: #ffffff;
  --color-ink: #14262b;
  --color-ink-soft: #4a5f63;
  --color-primary: #0f6b6b;
  --color-primary-dark: #0a4d4d;
  --color-accent: #d9a21b;
  --color-line: #cbd5d3;
  --color-focus: #1b6ef3;
  --radius-card: 14px;
  --radius-control: 8px;
  --font-title: "Bricolage Grotesque", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; }
body { background: var(--color-bg); color: var(--color-ink); font: 400 1rem/1.5 var(--font-body); }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Header */
.header { background: var(--color-primary-dark); color: #fff; border-bottom: 4px solid var(--color-accent); }
.header__brand { max-width: 1040px; margin: 0 auto; padding: 1.25rem 1.5rem; display: flex; align-items: center; gap: 0.85rem; }
.header__icon { width: 36px; height: 36px; fill: var(--color-accent); flex-shrink: 0; }
.header__title { font: 700 1.6rem/1.1 var(--font-title); letter-spacing: 0.04em; }
.header__subtitle { font-size: 0.9rem; opacity: 0.85; }

/* Layout */
.content { max-width: 1040px; margin: 0 auto; padding: 1.5rem; display: grid; gap: 1.25rem; }

/* Accordion */
.selector { position: relative; }
.selector__toggle {
  width: 100%; display: flex; align-items: center; gap: 1rem; text-align: left;
  padding: 0.9rem 1.1rem; background: var(--color-surface); color: var(--color-ink);
  border: 1.5px solid var(--color-line); border-radius: var(--radius-card); cursor: pointer; font: inherit;
}
.selector__toggle:hover { border-color: var(--color-primary); }
.selector__label { color: var(--color-ink-soft); font-size: 0.85rem; }
.selector__value { font: 600 1.15rem var(--font-title); flex: 1; }
.selector__chevron { width: 26px; height: 26px; fill: var(--color-primary); transition: transform 0.2s; }
.selector__toggle[aria-expanded="true"] { border-color: var(--color-primary); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.selector__toggle[aria-expanded="true"] .selector__chevron { transform: rotate(180deg); }

.selector__panel {
  background: var(--color-surface); border: 1.5px solid var(--color-primary); border-top: 0;
  border-radius: 0 0 var(--radius-card) var(--radius-card); padding: 1rem 1.1rem; display: grid; gap: 1rem;
}
.selector__panel[hidden] { display: none; }
.region-group__name { font: 600 0.95rem var(--font-title); color: var(--color-primary-dark); margin-bottom: 0.4rem; }
.region-group__list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.state-button {
  padding: 0.45rem 0.8rem; border: 1.5px solid var(--color-line); border-radius: var(--radius-control);
  background: var(--color-bg); color: var(--color-ink); font: 500 0.9rem var(--font-body); cursor: pointer;
}
.state-button:hover { border-color: var(--color-primary); background: #e1efed; }
.state-button[aria-current="true"] { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }

/* Summary cards */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
.card { background: var(--color-surface); border: 1.5px solid var(--color-line); border-left: 6px solid var(--color-accent); border-radius: var(--radius-card); padding: 1rem 1.25rem; }
.card__label { font: 500 0.9rem var(--font-body); color: var(--color-ink-soft); }
.card__value { font: 700 2.4rem/1.2 var(--font-title); color: var(--color-primary-dark); }
.card__value--text { font-size: 1.6rem; padding-top: 0.45rem; }

/* Table */
.table-card { background: var(--color-surface); border: 1.5px solid var(--color-line); border-radius: var(--radius-card); padding: 1.25rem; }
.table-card__toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
.table-card__title { font: 600 1.25rem var(--font-title); }
.search input { width: min(340px, 100%); padding: 0.55rem 0.8rem; border: 1.5px solid var(--color-line); border-radius: var(--radius-control); font: inherit; }
.search input:disabled { background: var(--color-bg); }
.status { min-height: 1.5rem; color: var(--color-ink-soft); }
.status--error { color: #b3261e; font-weight: 500; }
.table-wrapper { max-height: 480px; overflow: auto; border: 1px solid var(--color-line); border-radius: var(--radius-control); }
.table { width: 100%; border-collapse: collapse; }
.table th { position: sticky; top: 0; background: var(--color-primary-dark); color: #fff; text-align: left; padding: 0.65rem 0.9rem; font-weight: 600; }
.table td { padding: 0.6rem 0.9rem; border-top: 1px solid var(--color-line); }
.table tbody tr:nth-child(even) { background: #f6f9f8; }
.table a { color: var(--color-primary); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.table a:hover { color: var(--color-primary-dark); }

@media (max-width: 600px) {
  .content { padding: 1rem; }
  .table th:nth-child(3), .table td:nth-child(3) { display: none; }
}
@media (prefers-reduced-motion: reduce) { .selector__chevron { transition: none; } }
</style>
</head>
<body>
  <header class="header">
    <div class="header__brand">
      <svg class="header__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      <div>
        <h1 class="header__title">A.N.G.E.L.I.C.A</h1>
        <p class="header__subtitle">Painel de localidades brasileiras</p>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="selector" aria-label="Seleção de estado">
      <button id="accordion-toggle" class="selector__toggle" aria-expanded="false" aria-controls="accordion-panel">
        <span class="selector__label">Estado</span>
        <span id="selected-state-label" class="selector__value">Carregando…</span>
        <svg class="selector__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
      <div id="accordion-panel" class="selector__panel" hidden></div>
    </section>

    <section class="summary" aria-label="Resumo">
      <article class="card">
        <h2 class="card__label">Total de cidades encontradas</h2>
        <p id="city-count" class="card__value">—</p>
      </article>
      <article class="card">
        <h2 class="card__label">ID da UF</h2>
        <p id="state-id" class="card__value">—</p>
      </article>
      <article class="card">
        <h2 class="card__label">Região</h2>
        <p id="state-region" class="card__value card__value--text">—</p>
      </article>
    </section>

    <section class="table-card" aria-label="Municípios">
      <div class="table-card__toolbar">
        <h2 class="table-card__title">Municípios</h2>
        <label class="search">
          <span class="visually-hidden">Filtrar município</span>
          <input id="city-search" type="search" placeholder="Filtrar município pelo nome" autocomplete="off" disabled>
        </label>
      </div>
      <p id="status-message" class="status" role="status"></p>
      <div class="table-wrapper">
        <table class="table">
          <thead>
            <tr><th scope="col">Município</th><th scope="col">Código IBGE</th><th scope="col">Mesorregião</th></tr>
          </thead>
          <tbody id="city-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
const IBGE_API_URL = "https://servicodados.ibge.gov.br/api/v1/localidades";
const DEFAULT_STATE_ACRONYM = "DF";

const elements = {
  accordionToggle: document.getElementById("accordion-toggle"),
  accordionPanel: document.getElementById("accordion-panel"),
  selectedStateLabel: document.getElementById("selected-state-label"),
  cityCount: document.getElementById("city-count"),
  stateId: document.getElementById("state-id"),
  stateRegion: document.getElementById("state-region"),
  citySearch: document.getElementById("city-search"),
  cityTableBody: document.getElementById("city-table-body"),
  statusMessage: document.getElementById("status-message"),
};

let states = [];
let loadedCities = [];
let selectedState = null;

async function fetchJson(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Erro ${response.status} ao consultar o IBGE`);
  return response.json();
}

const fetchStates = () => fetchJson(`${IBGE_API_URL}/estados?orderBy=nome`);
const fetchCitiesByState = (stateId) => fetchJson(`${IBGE_API_URL}/estados/${stateId}/municipios?orderBy=nome`);

function buildGoogleMapsUrl(cityName, stateAcronym) {
  const query = encodeURIComponent(`${cityName}, ${stateAcronym}, Brasil`);
  return `https://www.google.com/maps/search/?api=1&query=${query}`;
}

function setStatus(message, isError = false) {
  elements.statusMessage.textContent = message;
  elements.statusMessage.classList.toggle("status--error", isError);
}

function toggleAccordion(shouldOpen) {
  elements.accordionToggle.setAttribute("aria-expanded", String(shouldOpen));
  elements.accordionPanel.hidden = !shouldOpen;
}

function renderAccordion() {
  const statesByRegion = states.reduce((groups, state) => {
    const regionName = state.regiao.nome;
    (groups[regionName] ||= []).push(state);
    return groups;
  }, {});

  elements.accordionPanel.innerHTML = "";
  Object.keys(statesByRegion).sort().forEach((regionName) => {
    const group = document.createElement("div");
    group.className = "region-group";
    group.innerHTML = `<h3 class="region-group__name">${regionName}</h3><div class="region-group__list"></div>`;
    const list = group.querySelector(".region-group__list");

    statesByRegion[regionName].forEach((state) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "state-button";
      button.textContent = `${state.nome} (${state.sigla})`;
      button.dataset.acronym = state.sigla;
      list.appendChild(button);
    });
    elements.accordionPanel.appendChild(group);
  });
}

function markSelectedStateButton() {
  elements.accordionPanel.querySelectorAll(".state-button").forEach((button) => {
    button.setAttribute("aria-current", String(button.dataset.acronym === selectedState.sigla));
  });
}

function renderCities(cities) {
  elements.cityTableBody.innerHTML = "";
  const fragment = document.createDocumentFragment();

  cities.forEach((city) => {
    const row = document.createElement("tr");
    const mesoregion = city.microrregiao?.mesorregiao?.nome ?? "—";

    const nameCell = document.createElement("td");
    const link = document.createElement("a");
    link.href = buildGoogleMapsUrl(city.nome, selectedState.sigla);
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = city.nome;
    nameCell.appendChild(link);

    const idCell = document.createElement("td");
    idCell.textContent = city.id;
    const mesoCell = document.createElement("td");
    mesoCell.textContent = mesoregion;

    row.append(nameCell, idCell, mesoCell);
    fragment.appendChild(row);
  });
  elements.cityTableBody.appendChild(fragment);
}

function updateSummary() {
  elements.cityCount.textContent = loadedCities.length;
  elements.stateId.textContent = selectedState.id;
  elements.stateRegion.textContent = selectedState.regiao.nome;
  elements.selectedStateLabel.textContent = `${selectedState.nome} (${selectedState.sigla})`;
}

function normalizeText(text) {
  return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

function filterCities() {
  const searchTerm = normalizeText(elements.citySearch.value);
  const filteredCities = loadedCities.filter((city) => normalizeText(city.nome).includes(searchTerm));
  renderCities(filteredCities);
  setStatus(filteredCities.length ? "" : "Nenhum município encontrado para esse filtro.");
}

async function selectState(state) {
  selectedState = state;
  elements.citySearch.value = "";
  elements.citySearch.disabled = true;
  elements.cityTableBody.innerHTML = "";
  setStatus("Carregando municípios…");
  markSelectedStateButton();
  elements.selectedStateLabel.textContent = `${state.nome} (${state.sigla})`;

  try {
    loadedCities = await fetchCitiesByState(state.id);
    updateSummary();
    renderCities(loadedCities);
    elements.citySearch.disabled = false;
    setStatus("");
  } catch (error) {
    elements.cityCount.textContent = "—";
    setStatus("Não foi possível carregar os municípios. Verifique sua conexão e escolha o estado novamente.", true);
    console.error(error);
  }
}

async function init() {
  elements.accordionToggle.addEventListener("click", () => {
    toggleAccordion(elements.accordionToggle.getAttribute("aria-expanded") !== "true");
  });

  elements.accordionPanel.addEventListener("click", (event) => {
    const button = event.target.closest(".state-button");
    if (!button) return;
    const state = states.find((item) => item.sigla === button.dataset.acronym);
    toggleAccordion(false);
    selectState(state);
  });

  elements.citySearch.addEventListener("input", filterCities);

  try {
    states = await fetchStates();
    renderAccordion();
    await selectState(states.find((state) => state.sigla === DEFAULT_STATE_ACRONYM) ?? states[0]);
  } catch (error) {
    elements.selectedStateLabel.textContent = "Indisponível";
    setStatus("Não foi possível carregar os estados do IBGE. Recarregue a página.", true);
    console.error(error);
  }
}

init();
</script>
</body>
</html>
